#:schema node_modules/wrangler/config-schema.json
#
# Cloudflare configuration for Core.
#
# Nothing in this file is a secret. Database and namespace ids are Cloudflare's
# internal identifiers — they are useless without credentials for the account
# that owns them, which is why they are safe to commit and why a self-hoster
# simply replaces them with their own.
#
# Real secrets never appear here. They go to the Worker secret store:
#     pnpm cf secret put AUTH_PEPPER
# and to .dev.vars for local development, which is git-ignored.

name = "core"
main = ".open-next/worker.js"
assets = { directory = ".open-next/assets", binding = "ASSETS" }
compatibility_date = "2026-08-26"
compatibility_flags = ["nodejs_compat"]

# ---------------------------------------------------------------------------
# Preview URLs, off.
#
# Cloudflare gives every deployment its own permanent public URL unless told
# not to. For most projects that is a convenience. Here it means every build
# ever deployed stays reachable by anybody who has the link, bound to the same
# live D1 — so a bug fixed in one deploy is still being served, against real
# data, at an address nobody is watching.
#
# The first deployment turned these on by default and said so in a warning.
# ---------------------------------------------------------------------------
preview_urls = false

# One origin, now that `core.harshitsaini.in` answers.
#
# The `*.workers.dev` address was the only way in until the domain was pointed
# here. Leaving it on afterwards means two addresses serving the same vault:
# two places a session cookie can exist, two origins a service worker can be
# registered against, and a second name that looks official enough to imitate.
workers_dev = false

# ---------------------------------------------------------------------------
# D1 — the encrypted vault.
#
# Every user-data column in this database holds ciphertext. If a query ever
# returns something a human can read, that is a bug, not a feature.
# ---------------------------------------------------------------------------
[[d1_databases]]
binding = "DB"
database_name = "core-vault"
database_id = "ca642db4-f5ca-4c06-a4d7-e23dab58940d"
# Relative to this file, which lives in apps/web because the OpenNext
# build looks for the config beside the Next app rather than at the repo root.
migrations_dir = "../../packages/db/migrations"

# ---------------------------------------------------------------------------
# KV — rate limit counters and account lockout state.
#
# Deliberately separate from D1: this data is high-write, short-lived and
# worthless if lost, which is the opposite of the vault in every respect.
# ---------------------------------------------------------------------------
[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "ce6dfdbbd41a4e74af8c90e30360bafe"

[observability]
enabled = true

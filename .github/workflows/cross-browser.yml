name: Cross-browser

# Firefox and WebKit, away from the push path.
#
# Running four projects on every push would roughly double an eight-minute
# suite for feedback that changes far less often than the code does. WebKit
# still matters — every browser on iOS is Safari underneath, and this is a
# mobile-first PWA — so it runs nightly and on demand rather than not at all.

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    name: firefox and webkit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generate a throwaway pepper for the test run
        run: |
          {
            echo "AUTH_PEPPER=$(node -e "console.log(require('crypto').randomBytes(32).toString('base64'))")"
            echo "NEXT_PUBLIC_APP_URL=http://localhost:3000"
            # Locally and here, workerd sets cf-connecting-ip itself, so the
            # rate limiter is live and the whole suite shares one address.
            # In test mode it takes the caller from a header instead, and does
            # not limit a request that omits one — so the rate-limit spec gets
            # real buckets and nothing else in the run is throttled.
            echo "RATE_LIMIT_TEST_MODE=1"
          } > apps/web/.dev.vars

      - name: Make key derivation cheap for the test run
        # Argon2id at production settings allocates 64 MiB per hash and runs
        # twice per browser test. Several at once starves the runner, and tests
        # then fail on assertions that had time but no CPU. The algorithm and
        # every property the suite asserts are unchanged; only the cost is.
        run: echo "NEXT_PUBLIC_TEST_KDF=1" > apps/web/.env.local

      - run: pnpm exec playwright install --with-deps chromium firefox webkit

      - run: pnpm build

      - env:
          E2E_ALL_BROWSERS: '1'
        run: pnpm e2e --project=firefox --project=webkit

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-cross-browser
          path: playwright-report/
          retention-days: 7

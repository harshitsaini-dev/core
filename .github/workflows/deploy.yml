name: Deploy

# Deploys from CI, never from a laptop, and the reason is not preference.
#
# The OpenNext build cannot run on Windows. pnpm links `react`, `react-dom` and
# `styled-jsx` into the build output as symlinks, and esbuild on Windows cannot
# traverse them — the build fails with "Access is denied" on each. OpenNext
# warns about this itself and recommends WSL. So the choices were WSL on one
# machine or Linux in CI, and CI wins on the thing that matters more than
# convenience: every deploy comes from a clean checkout on an identical
# machine, rather than from whatever state a working directory happens to be in.
#
# `workers-build.yml` already proves this build works here.

on:
  # Only by hand, and only from main. A password manager should not go out
  # because somebody merged a README change, and a deploy that happens without
  # anybody deciding to deploy is a deploy nobody is watching.
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy" to confirm'
        required: true
        default: ''

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: build and deploy to Cloudflare
    runs-on: ubuntu-latest
    # No `environment:` here. It would add a second place for the same two
    # secrets to live and a second thing to get wrong, and it buys nothing
    # unless it is configured with reviewers. What actually restricts this is
    # the trigger: `workflow_dispatch` needs write access to the repository, so
    # a fork cannot start it and neither can a pull request.
    steps:
      - name: Check the confirmation
        if: inputs.confirm != 'deploy'
        run: |
          echo "Confirmation was '${{ inputs.confirm }}', expected 'deploy'."
          exit 1

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Resolved once, used by the build and by the check at the end.
      #
      # Required, not optional. `NEXT_PUBLIC_APP_URL` is inlined at build time,
      # so leaving it unset does not fail — it ships `http://localhost:3000` as
      # the canonical URL and in every Open Graph tag, which is what the first
      # deployment did.
      - name: Resolve the public URL
        run: |
          url="${{ vars.DEPLOY_URL }}"
          if [ -z "$url" ]; then
            echo "DEPLOY_URL is not set. It is the address this instance is"
            echo "served from, and the build inlines it — without it the"
            echo "deployed site would advertise localhost as its own URL."
            exit 1
          fi
          case "$url" in https://*|http://*) ;; *) url="https://$url" ;; esac
          echo "APP_URL=${url%/}" >> "$GITHUB_ENV"
          echo "Building for ${url%/}"

      # The same gates a push runs, again, because a green run from an hour ago
      # says nothing about the commit being deployed now.
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

      - name: Build for the Workers runtime
        run: pnpm build:cf
        env:
          NEXT_PUBLIC_APP_URL: ${{ env.APP_URL }}

      # Migrations before the code, not after. A new column the new code reads
      # has to exist before that code starts serving; the other order is a
      # window where every request fails.
      - name: Apply migrations to the remote database
        run: pnpm db:migrate
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy
        run: pnpm --filter @core/web exec opennextjs-cloudflare deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # `AUTH_PEPPER` is deliberately not set here. It is a Worker secret, set
      # once with `wrangler secret put`, and a deploy that could rewrite it
      # could also lose it — which would lock every existing account out
      # permanently, since the verifier cannot be recomputed without it.
      # A deploy that reports success and serves nothing is the failure worth
      # catching, so this asks the running instance rather than trusting the
      # step above.
      - name: Check the deployed instance answers
        run: |
          url="$APP_URL"

          # `|| true` is what makes the comparison decide rather than curl's own
          # exit code. The first run set DEPLOY_URL without a scheme, curl
          # exited 6, and under `bash -e` that ended the step before the
          # assertion it was there to feed.
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$url" || true)
          echo "$url -> ${code:-no answer}"

          if [ "$code" != "200" ]; then
            echo "The deploy succeeded but the instance did not answer with 200."
            exit 1
          fi

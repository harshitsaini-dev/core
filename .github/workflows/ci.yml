name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Lets a run be started by hand when a push event does not produce one.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: typecheck / lint / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm lint

      - run: pnpm format:check

      - run: pnpm test

  e2e:
    name: end-to-end
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generate a throwaway pepper for the test run
        # apps/web/.dev.vars is git-ignored, so CI has to make its own. It lives
        # beside wrangler.toml, which is where the adapter looks for it. This value exists
        # for the length of one job against an empty local D1 replica; it never
        # protects anything real and is deliberately not a stored secret.
        run: |
          {
            echo "AUTH_PEPPER=$(node -e "console.log(require('crypto').randomBytes(32).toString('base64'))")"
            echo "NEXT_PUBLIC_APP_URL=http://localhost:3000"
            # Locally and here, workerd sets cf-connecting-ip itself, so the
            # rate limiter is live and the whole suite shares one address.
            # In test mode it takes the caller from a header instead, and does
            # not limit a request that omits one — so the rate-limit spec gets
            # real buckets and nothing else in the run is throttled.
            echo "RATE_LIMIT_TEST_MODE=1"
          } > apps/web/.dev.vars

      - name: Make key derivation cheap for the test run
        # Argon2id at production settings allocates 64 MiB per hash and runs
        # twice per browser test. Several at once starves the runner, and tests
        # then fail on assertions that had time but no CPU. The algorithm and
        # every property the suite asserts are unchanged; only the cost is.
        run: echo "NEXT_PUBLIC_TEST_KDF=1" > apps/web/.env.local

      - run: pnpm exec playwright install --with-deps chromium

      - run: pnpm build

      # Chromium and a phone viewport on every push. A layout that only works
      # on one of them is not finished, and this is a mobile-first PWA.
      # Firefox and WebKit run on a schedule; see cross-browser.yml.
      - run: pnpm e2e

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
